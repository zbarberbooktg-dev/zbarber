name: Zbarber OTA — Test
on:
  workflow_dispatch: {}
jobs:
  publish_update:
    type: update
    environment: preview
    env:
      EXPO_PUBLIC_DOMAIN: api.test.zbarber.net
      EXPO_PUBLIC_CLERK_PROXY_URL: https://zbarber.net/api/__clerk
    params:
      channel: test
    hooks:
      after_checkout:
        - name: Verify test release configuration
          run: |
            if [ -f artifacts/mobile/scripts/check-ota-env.cjs ]; then cd artifacts/mobile; fi
            node scripts/check-ota-env.cjs test
